<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="eKKGS">
  <meta name="application-name" content="eKKGS">
  <meta name="theme-color" content="#0d9488">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>eKKGS</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #f0fdfa;
      overflow: hidden;
      touch-action: manipulation;
    }
    iframe {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe
    src="https://script.google.com/a/macros/moe-dl.edu.my/s/AKfycbyTQBRV7ap03CAryw3BL3-7HIBic7B-0HCFbVrHPcw6KJJTUyaLtA-O3045L6XeHKnN/exec"
    allowfullscreen>
  </iframe>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/ekkgs/sw.js')
          .then(r => console.log('[eKKGS] SW registered:', r.scope))
          .catch(e => console.warn('[eKKGS] SW failed:', e));
      });
    }
  </script>
</body>
</html>
